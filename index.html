<title>der die das</title>

<style>
/* Layout: one-screen phone app — fixed header, flexible card stage, controls pinned low.
   The three genders ARE the palette (der=blue, die=red, das=green); everything else stays quiet. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb;
  --fg:#18202e; --muted:#5d6b80; --line:#dde3ec; --faint:#eceff4;
  --accent:#2d3a57;                       /* quiet structural ink */
  --der:#1e1e1e; --der-bg:#e7e7ea;        /* masculine — flag black */
  --die:#cc2531; --die-bg:#fbe3e5;        /* feminine  — flag red   */
  --das:#a97d08; --das-bg:#f8efce;        /* neuter    — flag gold   */
  --good:#1f8a63; --bad:#cc2531;
  --r:16px; --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a212b; --surface-2:#161d26;
  --fg:#e9edf3; --muted:#9aa7b8; --line:#28313f; --faint:#1e2631;
  --accent:#c3cde6;
  --der:#e8eaef; --der-bg:#2b303a;
  --die:#ff6e78; --die-bg:#39212a;
  --das:#ffcf4a; --das-bg:#352d12;
  --good:#5ed29f; --bad:#ff6e78;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a212b; --surface-2:#161d26;
  --fg:#e9edf3; --muted:#9aa7b8; --line:#28313f; --faint:#1e2631;
  --accent:#c3cde6;
  --der:#e8eaef; --der-bg:#2b303a;
  --die:#ff6e78; --die-bg:#39212a;
  --das:#ffcf4a; --das-bg:#352d12;
  --good:#5ed29f; --bad:#ff6e78;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column;height:100%;
  max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}

/* header */
header{display:flex;align-items:center;justify-content:space-between;
  padding-block:14px 10px;flex:0 0 auto}
.brand{font-family:var(--font-display);font-weight:600;font-size:1.15rem;
  letter-spacing:-.01em;display:flex;gap:.12em}
.brand .d1{color:var(--der)} .brand .d2{color:var(--die)} .brand .d3{color:var(--das)}
.stat{font-size:.72rem;color:var(--muted);text-align:right;line-height:1.3}
.stat b{color:var(--fg);font-weight:600}
.linklike{background:none;border:0;color:var(--muted);font-size:.72rem;
  text-decoration:underline;padding:2px 0}

/* ---------- HOME ---------- */
#home{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:18px;
  padding-bottom:20px}
.lede{font-family:var(--font-display);font-size:1.5rem;line-height:1.2;
  font-weight:500;text-wrap:balance;margin:4px 0 0}
.lede small{display:block;font-family:var(--font-ui);font-size:.82rem;
  font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:.01em}

.seg{display:flex;background:var(--faint);border:1px solid var(--line);
  border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;
  padding:10px 8px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .arrow{font-weight:400;opacity:.6}

.section-label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{display:flex;flex-direction:column;gap:3px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 14px 13px;transition:transform .08s ease,border-color .15s}
.deck:active{transform:scale(.98)}
.deck .nm{font-weight:600;font-size:.95rem}
.deck .ct{font-size:.74rem;color:var(--muted)}
.deck.wide{grid-column:1 / -1;flex-direction:row;align-items:center;
  justify-content:space-between}
.deck.drill{border-color:transparent;
  background:linear-gradient(135deg,var(--der-bg),var(--die-bg) 55%,var(--das-bg))}
.deck.drill .nm{color:var(--fg)}
.deck.tricky .nm::after{content:"";}

/* ---------- STUDY ---------- */
#study{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding-block:6px 10px;flex:0 0 auto}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  width:38px;height:38px;font-size:1.1rem;flex:0 0 auto;display:grid;place-items:center}
.topmeta{flex:1 1 auto;min-width:0}
.topmeta .nm{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.topmeta .sub{font-size:.72rem;color:var(--muted)}
.score{font-size:.78rem;color:var(--muted);text-align:right;flex:0 0 auto}
.score b{color:var(--good);font-weight:700}

.bar{height:5px;background:var(--faint);border-radius:99px;overflow:hidden;flex:0 0 auto}
.bar>i{display:block;height:100%;width:0;background:var(--accent);
  border-radius:99px;transition:width .25s ease}

/* card stage */
.stage{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  min-height:0;padding:10px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:26px 20px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;min-height:0;flex:1 1 auto;text-align:center;
  box-shadow:0 2px 10px rgba(20,30,50,.05)}
.kicker{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:600}
.term{font-family:var(--font-display);font-weight:500;line-height:1.12;
  font-size:clamp(1.9rem,8vw,3rem);text-wrap:balance;letter-spacing:-.01em}
.term .art{font-style:italic}
.term.der .art{color:var(--der)} .term.die .art{color:var(--die)} .term.das .art{color:var(--das)}
.answer{font-size:clamp(1.15rem,5vw,1.5rem);font-weight:600}
.example{font-size:.9rem;color:var(--muted);line-height:1.45;max-width:34ch;
  border-top:1px solid var(--line);padding-top:12px;font-family:var(--font-display);
  font-style:italic}
.verdict{font-size:.82rem;font-weight:700;letter-spacing:.02em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}

/* controls */
.controls{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;
  padding-block:12px calc(14px + env(safe-area-inset-bottom,0px))}
.btn{border:0;border-radius:14px;padding:16px;font-size:1rem;font-weight:700;
  width:100%;transition:transform .07s ease,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#11151c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--fg);font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1}

/* der/die/das choice buttons */
.arts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.art-btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;
  padding:18px 6px 14px;font-weight:700;font-size:1.15rem;line-height:1;
  display:flex;flex-direction:column;gap:4px;align-items:center;
  transition:transform .07s ease,border-color .12s,background .12s}
.art-btn small{font-size:.6rem;font-weight:600;letter-spacing:.06em;color:var(--muted);
  text-transform:uppercase}
.art-btn:active{transform:scale(.97)}
.art-btn[data-k="der"]{color:var(--der)} .art-btn[data-k="der"].fill{background:var(--der-bg);border-color:var(--der)}
.art-btn[data-k="die"]{color:var(--die)} .art-btn[data-k="die"].fill{background:var(--die-bg);border-color:var(--die)}
.art-btn[data-k="das"]{color:var(--das)} .art-btn[data-k="das"].fill{background:var(--das-bg);border-color:var(--das)}
.art-btn.wrong{border-color:var(--bad);background:transparent;opacity:.55}
.art-btn:disabled{cursor:default}

/* done screen */
.done{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:14px}
.done .big{font-family:var(--font-display);font-size:2.6rem;font-weight:500;line-height:1}
.done .pct{font-size:3.4rem;font-weight:800;color:var(--accent);line-height:1;
  font-family:var(--font-ui)}
.done p{color:var(--muted);font-size:.9rem;margin:0}

.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--faint);
  border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.84rem;
  font-weight:600;color:var(--fg);align-self:flex-start}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--line);
  position:relative;transition:background .15s;flex:0 0 auto}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:var(--surface);transition:transform .15s;
  box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"] .sw{background:var(--das)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.spk{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface-2);color:var(--fg);display:inline-grid;place-items:center;
  transition:transform .07s ease,background .12s}
.spk:active{transform:scale(.9)}
.spk.speaking{color:var(--der);border-color:var(--der)}
.numword{font-size:clamp(1.3rem,6.4vw,2.1rem);overflow-wrap:anywhere;max-width:100%;line-height:1.15}
.grouphead{grid-column:1/-1;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.cfg{width:100%;display:flex;flex-direction:column;gap:9px}
.cfg .seg button{white-space:normal;line-height:1.2}
.hint{font-size:.78rem;color:var(--muted);text-align:center;max-width:32ch;margin:0 auto}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2.5px solid var(--der);outline-offset:2px;border-radius:6px}
</style>

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function accepted(c){ if(c.g.startsWith("der/die")) return ["der","die"];
  return (["der","die","das"].includes(c.a))?[c.a]:[]; }
function isNoun(c){ return c.c==="noun" && accepted(c).length>0; }
function bare(c){ const p=c.g.split(/\s+/);
  return (/^der|die|das/.test(p[0])&&p.length>1)?p.slice(1).join(" "):c.g; }

/* ---------------- speech (on-device German voice) ---------------- */
const canSpeak = typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";
let AUDIO=true, deVoice=null;
try{ AUDIO = (localStorage.getItem("ddd_audio")||"on")!=="off"; }catch(e){}
function pickVoice(){ if(!canSpeak) return;
  const vs=speechSynthesis.getVoices();
  deVoice = vs.find(v=>/^de[-_]/i.test(v.lang)) || vs.find(v=>/^de/i.test(v.lang)) || null; }
if(canSpeak){ pickVoice(); try{ speechSynthesis.addEventListener("voiceschanged",pickVoice); }catch(e){} }
function speechText(c){ return (c.g||"").replace("der/die ","die ").replace(/[()]/g,"").replace(/\s+/g," ").trim(); }
function speak(text){ if(!canSpeak||!text) return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="de-DE"; if(deVoice) u.voice=deVoice; u.rate=0.88;
    const btn=document.querySelector(".spk");
    if(btn){ u.onstart=()=>btn.classList.add("speaking");
             u.onend=u.onerror=()=>btn.classList.remove("speaking"); }
    speechSynthesis.speak(u);
  }catch(e){} }
function autoSpeak(text){ if(AUDIO) speak(text); }
const SPK='<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function spkBtn(say){ return canSpeak?`<button class="spk" data-say="${esc(say)}" aria-label="Hear it in German">${SPK}</button>`:""; }

let STATS={}, DIR="de";
try{ STATS=JSON.parse(localStorage.getItem("ddd_stats")||"{}"); }catch(e){ STATS={}; }
try{ DIR=localStorage.getItem("ddd_dir")||"de"; }catch(e){}
let NUM_RANGE=100, NUM_MODE="n2g";

try{ NUM_MODE=localStorage.getItem("ddd_nummode")||"n2g"; }catch(e){}
function save(){ try{ localStorage.setItem("ddd_stats",JSON.stringify(STATS)); }catch(e){} }
function saveDir(){ try{ localStorage.setItem("ddd_dir",DIR); }catch(e){} }
function record(c,ok){ const s=STATS[c.g]||(STATS[c.g]={s:0,k:0}); s.s++; if(ok)s.k++; save(); }
function seenCount(){ return Object.keys(STATS).length; }
function trickyCards(){
  return WORDS.filter(c=>{const s=STATS[c.g]; return s&&s.s>=2&&s.k/s.s<0.6;})
              .sort((a,b)=>{const A=STATS[a.g],B=STATS[b.g];return A.k/A.s-B.k/B.s;})
              .slice(0,24);
}

/* ---------------- numbers (counting) ---------------- */
const U=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun"];
const TEEN={10:"zehn",11:"elf",12:"zwölf",13:"dreizehn",14:"vierzehn",15:"fünfzehn",16:"sechzehn",17:"siebzehn",18:"achtzehn",19:"neunzehn"};
const TENS={20:"zwanzig",30:"dreißig",40:"vierzig",50:"fünfzig",60:"sechzig",70:"siebzig",80:"achtzig",90:"neunzig"};
function numDE(n){
  if(n<10) return U[n];
  if(n<20) return TEEN[n];
  if(n<100){ const t=Math.floor(n/10)*10, u=n%10;
    return u ? (u===1?"ein":U[u])+"und"+TENS[t] : TENS[t]; }
  if(n<1000){ const h=Math.floor(n/100), r=n%100;
    return (h===1?"ein":U[h])+"hundert"+(r?numDE(r):""); }
  if(n===1000) return "eintausend";
  return String(n);
}
function numberDeck(max,count){
  const used=new Set(), out=[];
  while(out.length<count){ const n=Math.floor(Math.random()*(max+1));
    if(used.has(n)) continue; used.add(n);
    out.push({g:numDE(n), e:String(n), a:"", c:"number", x:""}); }
  return out;
}

/* ---------------- home render ---------------- */
function renderHome(){
  $("#homeStat").innerHTML = seenCount()
     ? `<b>${seenCount()}</b> words practised`
     : `tap a deck to start`;
  $("#dirSeg").querySelectorAll("button").forEach(b=>
     b.setAttribute("aria-pressed", b.dataset.dir===DIR));
  const grid=$("#deckGrid"); grid.innerHTML="";
  const mk=d=>{
    const n=d.get().length;
    if(d.id==="tricky" && n<4) return;      // only show once there's data
    const b=document.createElement("button");
    b.className="deck"+(d.wide?" wide":"")+((d.drill||d.special==="numbers")?" drill":"")+(d.id==="tricky"?" tricky":"");
    b.innerHTML=`<span class="nm">${d.nm}</span>`+
      `<span class="ct">${d.special ? d.sub : (d.sub?d.sub+" · ":"")+n+" card"+(n===1?"":"s")}</span>`;
    b.onclick=()=>start(d);
    grid.appendChild(b);
  };
  DECKS.filter(d=>d.group!=="theme").forEach(mk);
  const gh=document.createElement("div");
  gh.className="grouphead";
  gh.textContent="For your role · Swiss Sports Federation";
  grid.appendChild(gh);
  DECKS.filter(d=>d.group==="theme").forEach(mk);
}
$("#dirSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  DIR=b.dataset.dir; saveDir(); renderHome();};

audioBtn.setAttribute("aria-pressed", AUDIO);
audioBtn.onclick=()=>{ AUDIO=!AUDIO;
  try{ localStorage.setItem("ddd_audio", AUDIO?"on":"off"); }catch(e){}
  audioBtn.setAttribute("aria-pressed", AUDIO);
  if(AUDIO) speak("Guten Tag"); };
$("#stage").addEventListener("click",e=>{ const b=e.target.closest(".spk");
  if(b){ e.stopPropagation(); speak(b.dataset.say); } });

/* ---------------- session state machine ---------------- */
let S=null;
function start(deck){
  if(deck.special==="numbers") return openNumbers();
  const cards=shuffle(deck.get()); const mode=deck.drill?"drill":DIR;
  if(!cards.length) return;
  S={deck, mode, q:cards, n0:cards.length, ptr:0, answered:0, correct:0,
     phase:null, artChosen:null, artOk:true};
  $("#home").classList.add("hidden");
  $("#study").classList.remove("hidden");
  $("#deckName").textContent=deck.drill?"Article drill":deck.nm;
  $("#deckSub").textContent = deck.special==="numbers" ? "0–100 · hear & recall"
     : deck.drill ? "der · die · das"
     : (DIR==="de" ? "German → English" : "English → German");
  renderCard();
}
function backHome(){ S=null; $("#study").classList.add("hidden");
  $("#home").classList.remove("hidden"); renderHome(); }
$("#backBtn").onclick=backHome;

/* numbers: a config step for range + direction, then a generated session */
function numHint(){ return NUM_MODE==="g2n"
  ? "Hear the German number, then recall the digits."
  : "See the number, then say it in German."; }
function openNumbers(){
  S={deck:{special:"numbers"}, mode:"cfg"};
  $("#home").classList.add("hidden"); $("#study").classList.remove("hidden");
  $("#deckName").textContent="Numbers"; $("#deckSub").textContent="choose your practice";
  $("#scoreBox").textContent=""; $("#barFill").style.width="0%";
  const rOpts=[[20,"0–20"],[100,"0–100"],[1000,"0–1000"]];
  const mOpts=[["n2g","Number → German"],["g2n","German → number"]];
  $("#stage").innerHTML=`<div class="card" style="justify-content:center;gap:20px">
     <div class="cfg"><div class="section-label">Range</div>
       <div class="seg" id="numRange">${rOpts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${NUM_RANGE==v}">${l}</button>`).join("")}</div></div>
     <div class="cfg"><div class="section-label">Mode</div>
       <div class="seg" id="numMode">${mOpts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${NUM_MODE==v}">${l}</button>`).join("")}</div></div>
     <div class="hint" id="numHint">${numHint()}</div>
   </div>`;
  $("#controls").innerHTML=`<button class="btn primary" id="numStart">Start</button>`;
  const rng=$("#numRange"), md=$("#numMode");
  rng.onclick=e=>{ const b=e.target.closest("button"); if(!b) return;
    NUM_RANGE=+b.dataset.v; try{localStorage.setItem("ddd_numrange",NUM_RANGE);}catch(err){}
    rng.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.v===NUM_RANGE)); };
  md.onclick=e=>{ const b=e.target.closest("button"); if(!b) return;
    NUM_MODE=b.dataset.v; try{localStorage.setItem("ddd_nummode",NUM_MODE);}catch(err){}
    md.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===NUM_MODE));
    $("#numHint").textContent=numHint(); };
  $("#numStart").onclick=startNumbers;
}
function startNumbers(){
  const cards=numberDeck(NUM_RANGE,20);
  S={deck:{special:"numbers",nm:"Numbers"}, mode:(NUM_MODE==="g2n"?"numr":"num"),
     q:cards, n0:cards.length, ptr:0, answered:0, correct:0, phase:null, artChosen:null, artOk:true};
  $("#deckSub").textContent=`0–${NUM_RANGE} · ${NUM_MODE==="g2n"?"German → number":"number → German"}`;
  renderCard();
}

function updateTop(){
  const total=S.q.length, done=S.ptr, left=total-done;
  $("#barFill").style.width=(100*done/total)+"%";
  if(S.mode==="drill"){               // the only auto-graded mode → show a real score
    $("#scoreBox").innerHTML = S.answered ? `<b>${S.correct}</b>/${S.answered} · ${left} left`
                                          : `${total} cards`;
  } else {                            // self-marked → just show progress, no "score"
    $("#scoreBox").textContent = S.answered ? `${left} left` : `${total} cards`;
  }
}

function renderCard(){
  if(S.ptr>=S.q.length) return finish();
  updateTop();
  const c=S.q[S.ptr]; S.card=c; S.artChosen=null; S.artOk=true;
  const stage=$("#stage"), ctl=$("#controls");
  const nounMode = (S.mode==="drill") || (S.mode==="en" && isNoun(c));

  if(S.mode==="drill"){                               // bare noun → pick article
    S.phase="article";
    stage.innerHTML=`<div class="card">
        <div class="kicker">which article?</div>
        <div class="term">${bare(c)}</div>
        ${spkBtn(bare(c))}
        <div class="example" style="border:0;padding:0;font-style:normal;color:var(--muted)">${c.e}</div>
      </div>`;
    ctl.innerHTML=artButtons();
    wireArticles();
    autoSpeak(bare(c));
  } else if(S.mode==="en"){                            // English → German
    S.phase = nounMode ? "article" : "reveal";
    stage.innerHTML=`<div class="card">
        <div class="kicker">say it in German</div>
        <div class="term" style="font-family:var(--font-ui);font-weight:700">${c.e}</div>
      </div>`;
    if(nounMode){ ctl.innerHTML=artButtons(); wireArticles(); }
    else { ctl.innerHTML=`<button class="btn primary" id="flip">Show answer</button>`;
           $("#flip").onclick=()=>revealEN(c,false); }
  } else if(S.mode==="num"){                           // counting: numeral → German
    S.phase="reveal";
    stage.innerHTML=`<div class="card">
        <div class="kicker">say this number in German</div>
        <div class="term tnum" style="font-family:var(--font-ui);font-weight:800;font-size:clamp(3rem,17vw,5rem)">${c.e}</div>
      </div>`;
    ctl.innerHTML=`<button class="btn primary" id="flip">Show answer</button>`;
    $("#flip").onclick=()=>revealNum(c);
  } else if(S.mode==="numr"){                          // reverse: German (spoken) → numeral
    S.phase="reveal";
    stage.innerHTML=`<div class="card">
        <div class="kicker">which number?</div>
        <div class="term numword" style="font-family:var(--font-display)">${c.g}</div>
        ${spkBtn(c.g)}
      </div>`;
    ctl.innerHTML=`<button class="btn primary" id="flip">Show number</button>`;
    $("#flip").onclick=()=>revealNumR(c);
    autoSpeak(c.g);                                    // play it — the listening practice
  } else {                                             // German → English
    S.phase="reveal";
    stage.innerHTML=`<div class="card">
        <div class="kicker">what does it mean?</div>
        <div class="term ${c.a}">${german(c)}</div>
        ${spkBtn(speechText(c))}
      </div>`;
    ctl.innerHTML=`<button class="btn primary" id="flip">Show answer</button>`;
    $("#flip").onclick=()=>revealDE(c);
    autoSpeak(speechText(c));
  }
}

function german(c){ // colour the article inside the term
  const m=c.g.match(/^(der\/die|der|die|das)\s+(.*)$/);
  return m ? `<span class="art">${m[1]}</span> ${m[2]}` : c.g;
}
function artButtons(){
  return `<div class="arts">
   <button class="art-btn" data-k="der">der<small>masc.</small></button>
   <button class="art-btn" data-k="die">die<small>fem.</small></button>
   <button class="art-btn" data-k="das">das<small>neut.</small></button></div>`;
}
function wireArticles(){
  $("#controls").querySelectorAll(".art-btn").forEach(b=>
    b.onclick=()=>chooseArticle(b.dataset.k));
}
function chooseArticle(k){
  const c=S.card, ok=accepted(c).includes(k);
  S.artChosen=k; S.artOk=ok;
  const btns=$("#controls").querySelectorAll(".art-btn");
  btns.forEach(b=>{ b.disabled=true;
    if(accepted(c).includes(b.dataset.k)) b.classList.add("fill");
    if(b.dataset.k===k && !ok) { b.classList.remove("fill"); b.classList.add("wrong"); }
  });
  if(S.mode==="drill"){
    record(c,ok);
    S.answered++; if(ok)S.correct++; if(!ok)S.q.push(c);
    showDrillVerdict(ok);
  } else {
    revealEN(c,true);   // en→de noun: article picked, now reveal word
  }
}
function showDrillVerdict(ok){
  const c=S.card;
  const card=$("#stage").querySelector(".card");
  card.insertAdjacentHTML("beforeend",
    `<div class="verdict ${ok?'ok':'no'}">${ok?'✓ richtig':'✗ '+accepted(c).join('/')+' '+bare(c)}</div>`);
  const sb=$("#stage").querySelector(".spk"); if(sb) sb.dataset.say=speechText(c);
  $("#controls").innerHTML=`<button class="btn primary" id="nxt">Next</button>`;
  $("#nxt").onclick=next;
  autoSpeak(speechText(c));   // now say it with the article
}

function revealEN(c,wasNoun){   // english→german: show the German answer + self-mark
  S.phase="mark";
  $("#stage").innerHTML=`<div class="card">
     <div class="kicker">${wasNoun?(S.artOk?'<span style="color:var(--good)">article ✓</span>':'<span style="color:var(--bad)">article ✗</span>'):'in German'}</div>
     <div class="term ${c.a}">${german(c)}</div>
     ${spkBtn(speechText(c))}
     <div class="answer" style="color:var(--muted);font-weight:500">${c.e}</div>
     ${c.x?`<div class="example">${c.x}</div>`:""}
   </div>`;
  markButtons();
  autoSpeak(speechText(c));
}
function revealDE(c){           // german→english
  S.phase="mark";
  $("#stage").innerHTML=`<div class="card">
     <div class="kicker">meaning</div>
     <div class="term ${c.a}" style="font-size:clamp(1.5rem,6vw,2.2rem)">${german(c)}</div>
     ${spkBtn(speechText(c))}
     <div class="answer">${c.e}</div>
     ${c.x?`<div class="example">${c.x}</div>`:""}
   </div>`;
  markButtons();
}
function revealNum(c){          // counting: show the German number word + say it
  S.phase="mark";
  $("#stage").innerHTML=`<div class="card">
     <div class="kicker tnum" style="font-size:1.4rem;font-weight:800;color:var(--accent)">${c.e}</div>
     <div class="term numword" style="font-family:var(--font-display)">${c.g}</div>
     ${spkBtn(c.g)}
   </div>`;
  markButtons();
  autoSpeak(c.g);
}
function revealNumR(c){          // reverse counting: reveal the numeral
  S.phase="mark";
  $("#stage").innerHTML=`<div class="card">
     <div class="kicker">${c.g}</div>
     <div class="term tnum" style="font-family:var(--font-ui);font-weight:800;font-size:clamp(3rem,17vw,5rem)">${c.e}</div>
     ${spkBtn(c.g)}
   </div>`;
  markButtons();
}
function markButtons(){
  $("#controls").innerHTML=`<div class="row">
     <button class="btn ghost" id="again">Again</button>
     <button class="btn primary" id="got">Got it</button></div>`;
  $("#got").onclick=()=>mark(true);
  $("#again").onclick=()=>mark(false);
}
function mark(gotIt){
  const c=S.card;
  const ok = gotIt && S.artOk;      // article error counts as a miss
  if(S.mode!=="num" && S.mode!=="numr") record(c,ok);  // don't log generated numbers
  S.answered++; if(ok)S.correct++; if(!ok)S.q.push(c);
  next();
}
function next(){ S.ptr++; renderCard(); }

function finish(){
  updateTop();
  if(S.mode==="drill"){                 // auto-graded: a real score is honest here
    const pct=S.answered?Math.round(100*S.correct/S.answered):0;
    const msg = pct>=90?"Ausgezeichnet!" : pct>=70?"Gut gemacht!" : pct>=50?"Weiter so!" : "Übung macht den Meister.";
    $("#stage").innerHTML=`<div class="done">
       <div class="pct tnum">${pct}%</div>
       <div class="big">${msg}</div>
       <p>${S.correct} of ${S.answered} correct</p></div>`;
  } else {                              // self-marked: encourage, don't claim a score
    const msg = (S.correct===S.answered) ? "Ausgezeichnet!" : "Gut gemacht!";
    $("#stage").innerHTML=`<div class="done">
       <div class="big" style="font-size:3rem">${msg}</div>
       <p>${S.n0} card${S.n0===1?"":"s"} reviewed</p></div>`;
  }
  $("#controls").innerHTML=`<div class="row">
     <button class="btn ghost" id="home2">Decks</button>
     <button class="btn primary" id="redo">Study again</button></div>`;
  $("#home2").onclick=backHome;
  $("#redo").onclick=()=> S.deck.special==="numbers"?startNumbers():start(S.deck);
}

/* keyboard shortcuts (desktop bonus) */
document.addEventListener("keydown",e=>{
  if(!S) return;
  const k=e.key.toLowerCase();
  if(k==="escape") return backHome();
  if(S.phase==="article"){ const map={"1":"der","2":"die","3":"das"};
    if(map[k]) chooseArticle(map[k]); }
  else if(S.phase==="reveal" && (k===" "||k==="enter")){ e.preventDefault(); $("#flip")?.click(); }
  else if(S.phase==="mark"){ if(k==="y"||k==="enter"){e.preventDefault();mark(true);} if(k==="n")mark(false); }
  else if(S.q && S.ptr<S.q.length && $("#nxt") && (k===" "||k==="enter")){e.preventDefault();$("#nxt").click();}
});

renderHome();
</script>
</body>
</html>
